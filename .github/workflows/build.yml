name: build standalone program

# Builds a single-file program that needs no Python, for Windows, macOS (Apple silicon) and Linux, and smoke-tests it.
# Run it by hand (Actions tab > "build standalone program" > Run workflow) to get the files as downloadable artifacts.
# Pushing a tag such as v0.1.0 also publishes them as a GitHub Release, with a SHA256SUMS.txt to check a download against.
#
# Supply chain: every action is pinned to a commit (Dependabot proposes updates), and everything pip installs comes from
# requirements/build.txt, which records the SHA-256 of every file, so a replaced upload is refused. The pip cache is not used here:
# a release must not be built from files restored out of a cache that a pull request could have written.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            built: dist/datapipe.exe
            asset: datapipe-windows.exe
          - os: macos-latest
            built: dist/datapipe
            asset: datapipe-macos-arm64.tar.gz
          - os: ubuntu-latest
            built: dist/datapipe
            asset: datapipe-linux-x86_64.tar.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false     # later steps never push, so the token is not left in the checkout
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the locked build tools (each file is checked against its recorded hash), then the project itself
        run: |
          python -m pip install --require-hashes -r requirements/build.txt
          python -m pip install --no-deps --no-build-isolation .
      - name: Build
        run: python packaging/build.py
      - name: Smoke test the built program (no Python involved)
        shell: bash
        run: |
          set -e
          ./${{ matrix.built }} policies
          ./${{ matrix.built }} sample smoke.csv --mb 1
          ./${{ matrix.built }} --workdir smoke-work run smoke.csv --policy low --schema examples/schema_buyers.json --analysis examples/analysis_buyers.json --actor ci
          test -s smoke-work/runs/*/clean.csv
      - name: Build the Windows installer and test it (install, run, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python packaging/build_installer.py        # Inno Setup 6 is preinstalled on the Windows runner
          if ($LASTEXITCODE) { throw "installer build failed" }
          $setup = (Get-Item dist/datapipe-setup-*.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP "datapipe-installed"
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode) { throw "install failed: $($p.ExitCode)" }
          & "$dir\datapipe.exe" policies | Out-Null
          if ($LASTEXITCODE) { throw "the installed program does not run" }
          $un = Get-Item "$dir\unins*.exe" | Select-Object -First 1
          Start-Process $un.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          if (Test-Path "$dir\datapipe.exe") { throw "uninstall left the program behind" }
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          case "${{ matrix.asset }}" in
            *.tar.gz) tar -czf "out/${{ matrix.asset }}" -C dist datapipe ;;      # keeps the executable bit
            *) cp "${{ matrix.built }}" "out/${{ matrix.asset }}" ;;
          esac
          ls -l out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error
      - name: Package the Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p installer
          cp dist/datapipe-setup-*.exe installer/datapipe-windows-setup.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: runner.os == 'Windows'
        with:
          name: datapipe-windows-setup.exe
          path: installer/datapipe-windows-setup.exe
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write           # only this job, and only for tag builds, may create the release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: assets
          merge-multiple: true
      - name: Record the checksum of every file, so a download can be verified
        run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:                                   # the tag name goes in through the environment, never pasted into the script text
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" assets/* --repo "$REPO" --title "$TAG" --generate-notes
