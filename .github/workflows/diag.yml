name: diag
on:
  push:
    paths: [".github/workflows/diag.yml"]
jobs:
  diag:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: What does the authorizer see?
        run: |
          python - <<'EOF'
          import sqlite3, sys
          print(sys.version, "sqlite", sqlite3.sqlite_version)
          names = {getattr(sqlite3, n): n for n in dir(sqlite3) if n.startswith("SQLITE_") and isinstance(getattr(sqlite3, n), int)}
          log = []
          def auth(a, b, c, d, e):
              log.append((names.get(a, a), b, c, d, e)); return sqlite3.SQLITE_OK
          conn = sqlite3.connect(":memory:")
          conn.set_authorizer(auth)
          conn.executescript("CREATE TABLE t(a TEXT, b INTEGER); INSERT INTO t VALUES('x', 1);")
          for row in log: print(row)
          print("conn.isolation_level =", conn.isolation_level)
          EOF
