name: tests

# Supply chain: every action is pinned to a commit (Dependabot proposes updates), and everything pip installs comes from the files in
# requirements/, which record the SHA-256 of every package file, so a replaced upload is refused. The audit job looks the pinned
# packages up in the public vulnerability databases; the weekly run below makes it notice new reports even when nobody pushes.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read            # the workflow token can read the repository and nothing else

# A newer push to the same branch or pull request makes the older run pointless: stop it instead of paying for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    if: github.event_name != 'schedule'           # the weekly run only needs the (cheap) vulnerability audit below
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Every system on the oldest supported Python (3.11), the one the standalone program is built with (3.13) and the one a laptop installs
      # today (3.14). (3.10 ended on 2026-10-01.) The repository is public, so GitHub-hosted runners cost nothing; on a private repository
      # a macOS minute counts 10 times and a Windows minute 2 times, and this would need trimming again.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false     # later steps never push, so the token is not left in the checkout
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/test.txt
      - name: Install the locked test dependencies (each file is checked against its recorded hash)
        run: python -m pip install --require-hashes -r requirements/test.txt
      - name: Install the project itself (no dependencies and no build tools are fetched)
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Install Chromium for the browser tests
        run: python -m playwright install --with-deps chromium
      - name: Run the full suite (browser tests included)
        run: python -m pytest -q -rs

  audit:
    name: known vulnerabilities (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pip-audit (locked, with hashes)
        run: python -m pip install --require-hashes -r requirements/audit.txt
      - name: Look the pinned packages up in the vulnerability databases
        run: python -m pip_audit --disable-pip --require-hashes -r requirements/test.txt -r requirements/build.txt
